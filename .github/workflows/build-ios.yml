name: Build iOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          xcodebuild clean archive -scheme "YourApp" -destination "generic/platform=iOS" -archivePath build/App.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath .

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: "*.ipa"
